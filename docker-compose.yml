# Development / production compose. Only nginx publishes ports to the host.
# The seed profile (`--profile seed`) runs demo data once.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tzyoutube
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: tzyoutube
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tzyoutube"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  silo:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      # Silo is a MinIO fork and keeps the MINIO_* variable names.
      # Single source of truth for the secret: S3_SECRET_KEY is shared by
      # silo, web and worker — signing client and server must agree.
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set in .env}
      # Server-side region; clients must pass the same value explicitly
      # (S3_REGION below) so presigning never does a GetBucketLocation
      # network lookup.
      MINIO_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - silo_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    command: sh -c "uv run --no-sync alembic upgrade head && uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      SECRET_KEY: ${SECRET_KEY:?set in .env}
      DATABASE_URL: postgresql+asyncpg://tzyoutube:${POSTGRES_PASSWORD}@postgres:5432/tzyoutube
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: silo:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-localhost}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
      # Must match silo's MINIO_REGION — presigning is offline only when
      # the region is explicit.
      S3_REGION: ${S3_REGION:-us-east-1}
      # Public origin(s) for CSRF checks; set to your VM IP/domain in .env.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      # Session cookie Secure flag: enable only behind HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      silo:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: uv run --no-sync arq worker.main.WorkerSettings
    environment:
      APP_ENV: ${APP_ENV:-dev}
      SECRET_KEY: ${SECRET_KEY:?set in .env}
      DATABASE_URL: postgresql+asyncpg://tzyoutube:${POSTGRES_PASSWORD}@postgres:5432/tzyoutube
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: silo:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
      S3_REGION: ${S3_REGION:-us-east-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      silo:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      # Template, not a ready config: the image entrypoint renders it to
      # /etc/nginx/conf.d/ on start. A direct conf.d mount would skip
      # envsubst and nginx would die on $CSP_MEDIA_ORIGIN (ADR-008).
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      # Substitute ONLY CSP_* variables (^CSP_); $host/$remote_addr/$scheme
      # etc. stay nginx's own (ADR-008).
      NGINX_ENVSUBST_FILTER: "^CSP_"
      # CSP media-src origin for presigned video URLs (ADR-007/F1). Scheme is
      # a variable, never hardcoded; without .env the default http://localhost
      # makes a local `docker compose up` work (ADR-008).
      CSP_MEDIA_SCHEME: "${CSP_MEDIA_SCHEME:-http}"
      CSP_MEDIA_ORIGIN: "${CSP_MEDIA_SCHEME:-http}://${S3_PUBLIC_ENDPOINT:-localhost}"
    depends_on:
      - web
    restart: unless-stopped

  seed:
    build: .
    profiles: ["seed"]
    command: uv run --no-sync python scripts/seed.py
    environment:
      APP_ENV: dev
      SECRET_KEY: ${SECRET_KEY:?set in .env}
      DATABASE_URL: postgresql+asyncpg://tzyoutube:${POSTGRES_PASSWORD}@postgres:5432/tzyoutube
      S3_ENDPOINT: silo:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
      S3_REGION: ${S3_REGION:-us-east-1}
    depends_on:
      postgres:
        condition: service_healthy
      silo:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  silo_data:
