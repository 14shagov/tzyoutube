# Reverse proxy: the only published port. Proxies / to the web service,
# /videos/ and /thumbnails/ to the S3 storage (Silo; signature host
# validation, no rewrite).

server {
    listen 80;

    # Multipart upload limit (must match MAX_UPLOAD_SIZE in the app).
    client_max_body_size 512m;

    location /videos/ {
        proxy_pass http://silo:9000;
        proxy_set_header Host $host;
        proxy_request_buffering off;
    }

    location /thumbnails/ {
        proxy_pass http://silo:9000;
        proxy_set_header Host $host;
    }

    location /media/thumbnails/ {
        # Public-read bucket: rewrite /media/thumbnails/<obj> -> /thumbnails/<obj>
        rewrite ^/media/thumbnails/(.*)$ /thumbnails/$1 break;
        proxy_pass http://silo:9000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://web:8000;
        # $http_host carries the port (Host: localhost vs localhost:8080);
        # the CSRF check and cookie scope depend on an exact public host.
        proxy_set_header Host $http_host;
        # The app needs the public scheme (behind TLS offloading) for
        # origin checks and Secure-cookie decisions.
        proxy_set_header X-Forwarded-Proto $scheme;
        # Contract: the app reads the rate-limit client IP ONLY from
        # X-Real-IP, which this line OVERWRITES with the real client
        # address ($remote_addr). Never switch this to an additive
        # header (X-Forwarded-For appends and is client-spoofable).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
