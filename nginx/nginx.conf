# Reverse proxy: the only published port. Proxies / to the web service,
# /videos/ and /thumbnails/ to the S3 storage (Silo; signature host
# validation, no rewrite).
#
# Presigned URLs are signed for the PUBLIC host (S3_PUBLIC_ENDPOINT).
# Silo validates the SigV4 signature against the Host header, so every
# silo location must forward Host EXACTLY as the browser sent it
# ($http_host, with port). Changing this to $host drops the port and
# breaks signature validation.

# C5: IP-level rate limiting for the auth endpoints. The app layers its
# own per-account limits (register/login) on top; this is the perimeter.
# This file is mounted at /etc/nginx/conf.d/default.conf (http context).
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=10r/m;

server {
    listen 80;

    # C5: default body cap for everything; ONLY the upload location below
    # overrides it to 512m (must match MAX_UPLOAD_SIZE in the app).
    client_max_body_size 10m;

    # C5: baseline security headers on every response. Inherited by all
    # locations EXCEPT /media/thumbnails/, which declares its own add_header
    # (Cache-Control) and therefore re-declares these three itself.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # F1 (ADR-007): CSP allows ONLY same-origin scripts/styles — every JS
    # file is external (/static/*.js), there are no inline handlers, so
    # script-src 'self' holds. Media may also come from the presign host
    # ($CSP_MEDIA_ORIGIN is set from S3_PUBLIC_ENDPOINT in compose; nginx
    # exposes env vars as variables by default, unset -> empty).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' $CSP_MEDIA_ORIGIN; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # C5: auth endpoints (bcrypt cost 12) are rate-limited at the proxy too.
    location /auth/ {
        limit_req zone=auth_per_ip burst=20 nodelay;
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # C5: the ONLY location accepting a 512m body is the video upload.
    # Unbuffered proxying lets the app abort mid-body on the size limit
    # (and pre-check Content-Length) instead of nginx spooling the file.
    location = /api/videos {
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Task 5: video delivery must STREAM — never spool the whole object to a
    # temp file (breaks Range/206 seeking on big files). Range goes to the
    # storage as-is; Accept-Ranges comes back to the browser. Content-Type /
    # Content-Disposition from the (presigned) response are passed through
    # untouched — nothing here hides or rewrites them.
    location /videos/ {
        proxy_pass http://silo:9000;
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_set_header Range $http_range;
        proxy_pass_header Accept-Ranges;
        # Task 8: silo sends its own X-Content-Type-Options — hide it so the
        # server-level add_header is the only one (no duplicate header).
        proxy_hide_header X-Content-Type-Options;
    }

    location /thumbnails/ {
        proxy_pass http://silo:9000;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_hide_header X-Content-Type-Options;
    }

    location /media/thumbnails/ {
        # Public-read bucket: rewrite /media/thumbnails/<obj> -> /thumbnails/<obj>
        rewrite ^/media/thumbnails/(.*)$ /thumbnails/$1 break;
        proxy_pass http://silo:9000;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        # Task 8: this location declares its own add_header (Cache-Control
        # below), which CANCELS server-level add_header inheritance — so the
        # security headers are re-declared here, and the upstream nosniff is
        # hidden to avoid a duplicate.
        proxy_hide_header X-Content-Type-Options;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer-when-downgrade always;
        # Task 2: public thumbnails are immutable per video id — cache 1h.
        # The private /videos/ location deliberately gets NO public cache.
        add_header Cache-Control "public, max-age=3600" always;
    }

    location / {
        proxy_pass http://web:8000;
        # $http_host carries the port (Host: localhost vs localhost:8080);
        # the CSRF check and cookie scope depend on an exact public host.
        proxy_set_header Host $http_host;
        # The app needs the public scheme (behind TLS offloading) for
        # origin checks and Secure-cookie decisions.
        proxy_set_header X-Forwarded-Proto $scheme;
        # Contract: the app reads the rate-limit client IP ONLY from
        # X-Real-IP, which this line OVERWRITES with the real client
        # address ($remote_addr). Never switch this to an additive
        # header (X-Forwarded-For appends and is client-spoofable).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
