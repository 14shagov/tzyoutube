[project]
name = "tzyoutube"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.162.4",
    "jinja2>=3.1.6",
    "minio>=7.2.20",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.3",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that need Docker services (run only with owner approval)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Autogenerated Alembic migrations keep their template style (old-style
# typing annotations, unused imports) — not worth linting.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI idiom: Depends(...)/require_role(...) in parameter defaults are
# evaluated once at router registration and are the documented pattern.
extend-immutable-calls = ["fastapi.Depends", "app.api.deps.require_role"]
