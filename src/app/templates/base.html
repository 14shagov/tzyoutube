<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Главная{% endblock %} · {{ brand | default('TZ Video') }}</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/theme.js"></script>
</head>
<body>
<header class="topbar">
  <div class="tb-left">
    <button id="menu-btn" class="icon-btn" type="button" aria-label="Меню">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <a class="logo" href="/" aria-label="TZ Video — на главную">
      <svg viewBox="0 0 28 20" width="30" height="21" aria-hidden="true"><rect width="28" height="20" rx="5" fill="#e62117"/><path d="M11 5.5v9l8-4.5z" fill="#fff"/></svg>
      <span class="logo-text">TZ&nbsp;Video</span>
    </a>
  </div>
  <form class="search" action="/search" method="get" role="search">
    <input type="search" name="q" value="{{ q | default('', true) }}" placeholder="Поиск" aria-label="Поиск по видео" autocomplete="off">
    <button class="icon-btn search-btn" type="submit" aria-label="Найти">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
  </form>
  <div class="tb-right">
    <a class="btn" href="/upload">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0 4 4m-4-4-4 4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      <span class="btn-label">Загрузить</span>
    </a>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="Переключить тему" title="Тема">
      <svg class="ic-sun" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="ic-moon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    {% if user %}
    <a class="avatar" href="/channel/{{ user.id }}" title="{{ user.channel_name }}">{{ user.channel_name[:1] | upper }}</a>
    <button id="logout-btn" class="btn ghost" type="button">Выйти</button>
    {% else %}
    <a class="btn primary" href="/login">Войти</a>
    {% endif %}
  </div>
</header>
<div class="layout">
  <nav class="sidebar" id="sidebar" aria-label="Разделы">
    <a class="side-item{% if page == 'home' %} active{% endif %}" href="/">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Главная</span>
    </a>
    <a class="side-item{% if page == 'subs' %} active{% endif %}" href="/subscriptions">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/></svg>
      <span>Подписки</span>
    </a>
    <a class="side-item{% if page == 'me' %} active{% endif %}" href="/me/videos">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
      <span>Вы</span>
    </a>
    {% if user and user.role in ('moderator', 'admin') %}
    <a class="side-item{% if page == 'mod' %} active{% endif %}" href="/mod">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20z"/><path d="M12 10v4m0 3h.01"/></svg>
      <span>Модерация</span>
    </a>
    {% endif %}
  </nav>
  <main class="content" id="content">
    {% block content %}{% endblock %}
  </main>
</div>
<div id="toast" class="toast" hidden role="status"></div>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
