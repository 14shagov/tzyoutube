{% extends "base.html" %}
{% block title %}Подписки{% endblock %}
{% block content %}
<h1 class="page-title">Подписки</h1>
{% if channels %}
<ul class="sub-channels">
  {% for ch in channels %}
  <li>
    <a class="sub-chan" href="/channel/{{ ch.id }}">
      <span class="avatar sm" aria-hidden="true">{{ ch.channel_name[:1] | upper }}</span>
      <span class="sub-name">{{ ch.channel_name }}</span>
    </a>
  </li>
  {% endfor %}
</ul>
{% endif %}
<h2 class="section-title">Новые видео</h2>
{% include "_cards.html" %}
{% endblock %}
